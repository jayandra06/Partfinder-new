name: PartFinder — Core unit tests

on:
  pull_request:
    paths:
      - 'PartFinder/**'
  push:
    branches: [main]
    paths:
      - 'PartFinder/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test PartFinder/PartFinder.Tests/PartFinder.Tests.csproj -c Release --no-restore
        continue-on-error: true
      - run: dotnet restore PartFinder/PartFinder.Tests/PartFinder.Tests.csproj
      - run: dotnet test PartFinder/PartFinder.Tests/PartFinder.Tests.csproj -c Release
