name: Sandbox — AIRS / radar sim

on:
  pull_request:
    paths:
      - 'sandbox/**'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/airs-radar-weather-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
