name: Portfolio — lint

on:
  pull_request:
    paths:
      - 'Partfinder-Portfolio/**'
  push:
    branches: [main]
    paths:
      - 'Partfinder-Portfolio/**'
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Partfinder-Portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Partfinder-Portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
